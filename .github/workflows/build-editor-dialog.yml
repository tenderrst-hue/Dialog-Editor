name: Build EDITOR DIALOG

on:
  workflow_dispatch:
  push:
    paths:
      - "sdk/mods/editor-dialog/**"
      - ".github/workflows/build-editor-dialog.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout EDITOR DIALOG
        uses: actions/checkout@v4
        with:
          path: project

      - name: Checkout Bearite SDK
        uses: actions/checkout@v4
        with:
          repository: Sp1KLe/Bearite
          ref: main
          path: bearite

      - name: Install Android NDK
        run: |
          SDKM="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Prepare mod in Bearite SDK
        run: |
          test -f bearite/sdk/build-mod.sh
          test -f bearite/sdk/bearite_api.h
          test -f bearite/sdk/bearite_il2cpp.h
          mkdir -p bearite/sdk/mods
          rm -rf bearite/sdk/mods/editor-dialog
          cp -a project/sdk/mods/editor-dialog bearite/sdk/mods/

      - name: Build EDITOR DIALOG (arm64-v8a)
        run: |
          cd bearite/sdk
          bash build-mod.sh mods/editor-dialog ../../dist

      - name: Upload mod ZIP
        uses: actions/upload-artifact@v4
        with:
          name: editor-dialog
          path: dist/editor-dialog.zip
          if-no-files-found: error
